name: Financial and workflow checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.lock
      - run: python scripts/check_publication.py
      - run: ruff check .
      - run: mypy marketprice app.py
      - run: pytest --junitxml=reports/pytest.xml
      - run: pip-audit -r requirements.lock
      - run: PYTHONPATH=. python scripts/benchmark.py --rows 1000
      - run: PYTHONPATH=. python scripts/generate_samples.py
      - run: playwright install --with-deps chromium
      - run: |
          streamlit run app.py --server.headless true > /tmp/marketprice.log 2>&1 &
          PYTHONPATH=. python scripts/browser_e2e.py
          PYTHONPATH=. python scripts/browser_session_isolation.py
