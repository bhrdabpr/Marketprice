[server]
maxUploadSize = 25
maxMessageSize = 100
address = "127.0.0.1"
enableXsrfProtection = true
enableCORS = true
[browser]
gatherUsageStats = false
[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F1F2F4"
secondaryBackgroundColor = "#E5E7EB"
textColor = "#111111"
font = "sans serif"
